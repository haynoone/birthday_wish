<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#57534e" />
      <stop offset="40%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="lavaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#f43f5e" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base App Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Volcano Mountain Body -->
  <path d="M12 52 L24 30 L40 30 L52 52 Z" fill="url(#mountainGrad)" />

  <!-- Caldera Crater Ridge -->
  <ellipse cx="32" cy="30" rx="8" ry="3" fill="#78350f" />
  <ellipse cx="32" cy="30" rx="6.5" ry="2" fill="url(#lavaGrad)" />

  <!-- Flowing Magma Trails -->
  <path d="M30 30 Q31 38 28 44 Q26 49 29 52" stroke="url(#lavaGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M35 30 Q33 37 36 43 Q38 48 35 52" stroke="url(#lavaGrad)" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Glowing Erupting Heart -->
  <g filter="url(#glowEffect)">
    <path d="M32 23.5 C32 23.5 23 15.5 23 10.8 C23 7.5 25.6 5 28.9 5 C30.8 5 32 6 32 6 C32 6 33.2 5 35.1 5 C38.4 5 41 7.5 41 10.8 C41 15.5 32 23.5 32 23.5 Z" fill="url(#heartGrad)" />
  </g>

  <!-- Sparkle Stars -->
  <path d="M16 17 L17.2 20.5 L21 21.5 L17.2 22.5 L16 26 L14.8 22.5 L11 21.5 L14.8 20.5 Z" fill="#fde047" />
  <path d="M48 18 L48.8 20.4 L51 21 L48.8 21.6 L48 24 L47.2 21.6 L45 21 L47.2 20.4 Z" fill="#fbbf24" opacity="0.9" />
  <circle cx="20" cy="34" r="1.2" fill="#fbbf24" />
  <circle cx="44" cy="32" r="1.2" fill="#fda4af" />
</svg>
