    <script>
      // Filter out benign Vite HMR websocket noise per environment constraints
      (function() {
        const isViteWsError = function(val) {
          if (!val) return false;
          const str = typeof val === 'string' ? val : (val.message || val.stack || '');
          return str.includes('send was called before connect') || str.includes('failed to connect to websocket');
        };

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(isViteWsError)) {
            console.debug('[vite:ignored-ws]', ...args);
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isViteWsError)) {
            console.debug('[vite:ignored-ws]', ...args);
            return;
          }
          origWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
          }
        });

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.error) || isViteWsError(event.message)) {
            event.preventDefault();
          }
        });
      })();
    </script>
